<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pin Tracer — Dollywood</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--sur:#161b22;--brd:#30363d;--txt:#e6edf3;--txt2:#8b949e;--acc:#58a6ff;--grn:#3fb950;--ff:system-ui,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--ff);font-size:14px;overflow:hidden}
#app{height:100%;display:flex}
#sidebar{width:260px;flex-shrink:0;display:flex;flex-direction:column;background:var(--sur);border-right:1px solid var(--brd)}
#cur{padding:12px;border-bottom:1px solid var(--brd)}
#cur .num{font-size:28px;font-weight:700;color:var(--acc);line-height:1}
#cur .nm{font-size:12px;margin-top:4px;line-height:1.35}
#cur .ar{font-size:11px;color:var(--txt2);margin-top:2px}
#prog{padding:7px 12px;font-size:12px;color:var(--txt2);border-bottom:1px solid var(--brd);display:flex;justify-content:space-between}
#items{flex:1;overflow-y:auto;font-size:12px}
.it{padding:5px 12px;display:flex;align-items:center;gap:7px;cursor:pointer;border-bottom:1px solid rgba(48,54,61,.4)}
.it:hover{background:rgba(255,255,255,.04)}
.it.active{background:rgba(88,166,255,.1);border-left:2px solid var(--acc)}
.it.done{opacity:.4}
.it .id{font-weight:700;color:var(--txt2);min-width:26px;font-size:11px}
.it.active .id{color:var(--acc)}
.it .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ck{color:var(--grn);font-size:10px;flex-shrink:0}
#btns{padding:10px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--brd)}
button{border:1px solid var(--brd);background:var(--bg);color:var(--txt);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13px;font-family:var(--ff);text-align:left}
button:hover{background:rgba(255,255,255,.06)}
#btn-export{border-color:var(--grn);color:var(--grn)}
#map-wrap{flex:1;overflow:hidden;position:relative;background:#111}
#mc{width:100%;height:100%;overflow:hidden;cursor:crosshair;position:relative;touch-action:none;user-select:none}
#mi{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#mimg{display:block;width:918px;height:645px;pointer-events:none;user-select:none}
#msvg{position:absolute;top:0;left:0;width:918px;height:645px;overflow:visible}
#tip{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(13,17,23,.88);border:1px solid var(--brd);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--txt2);pointer-events:none;z-index:10;white-space:nowrap}
</style>
</head>
<body>

    <div id="cur">
      <div class="num" id="c-num">—</div>

      <button id="btn-undo">Undo  [Z]</button>
      <button id="btn-export">Copy JSON  [E]</button>
    </div>
  </div>

let placed={},curIdx=0,hist=[];
let tx=0,ty=0,s=1,mdown=false,lm=null,dragged=false,t0=[],pd=0,pm=null;
const mc=document.getElementById('mc'),mi=document.getElementById('mi'),msvg=document.getElementById('msvg');

function applyT(ani){mi.style.transition=ani?'transform .25s ease':'none';mi.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;}
function dst(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
function midp(t){return{x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2};}

mc.addEventListener('touchstart',e=>{e.preventDefault();dragged=false;t0=Array.from(e.touches);if(t0.length===2){pd=dst(t0);pm=midp(t0);}},{passive:false});
mc.addEventListener('touchmove',e=>{e.preventDefault();const t=Array.from(e.touches);dragged=true;if(t.length===2){const d=dst(t),m=midp(t),r=d/pd;const rect=mc.getBoundingClientRect();const cx=m.x-rect.left,cy=m.y-rect.top;const ns=Math.min(10,Math.max(0.3,s*r)),sr=ns/s;tx=cx-sr*(cx-tx);ty=cy-sr*(cy-ty);s=ns;if(pm){tx+=m.x-pm.x;ty+=m.y-pm.y;}pd=d;pm=m;}else if(t.length===1&&t0.length===1){tx+=t[0].clientX-t0[0].clientX;ty+=t[0].clientY-t0[0].clientY;t0=t;}applyT(false);},{passive:false});
mc.addEventListener('touchend',e=>{t0=Array.from(e.touches);});
mc.addEventListener('mousedown',e=>{mdown=true;lm={x:e.clientX,y:e.clientY};dragged=false;});
window.addEventListener('mousemove',e=>{if(!mdown)return;const dx=e.clientX-lm.x,dy=e.clientY-lm.y;if(Math.abs(dx)+Math.abs(dy)>4)dragged=true;tx+=dx;ty+=dy;lm={x:e.clientX,y:e.clientY};applyT(false);});
window.addEventListener('mouseup',()=>{mdown=false;});
mc.addEventListener('wheel',e=>{e.preventDefault();const r=mc.getBoundingClientRect();const cx=e.clientX-r.left,cy=e.clientY-r.top;const d=e.deltaY>0?.85:1.18;const ns=Math.min(10,Math.max(0.3,s*d)),sr=ns/s;tx=cx-sr*(cx-tx);ty=cy-sr*(cy-ty);s=ns;applyT(false);},{passive:false});

mc.addEventListener('click',e=>{
  if(dragged)return;
  if(curIdx>=ITEMS.length)return;
  const rect=mc.getBoundingClientRect();
  const cx=(e.clientX-rect.left-tx)/s;
  const cy=(e.clientY-rect.top-ty)/s;
  const id=ITEMS[curIdx].id;
  hist.push({idx:curIdx,id,prev:placed[id]||null});
  placed[id]=[cx,cy];
  curIdx++;
  while(curIdx<ITEMS.length&&placed[ITEMS[curIdx].id])curIdx++;
  render();
});

function render(){
  if(curIdx<ITEMS.length){
    const it=ITEMS[curIdx];
    document.getElementById('c-num').textContent='#'+it.id;
    document.getElementById('c-nm').textContent=it.name;
    document.getElementById('c-ar').textContent=it.area;
  }else{
    document.getElementById('c-num').textContent='✓ Done';
    document.getElementById('c-nm').textContent='All pins placed';
    document.getElementById('c-ar').textContent='';
  }
  const n=Object.keys(placed).length;
  document.getElementById('p-n').textContent=n;
  document.getElementById('p-pct').textContent=Math.round(n/ITEMS.length*100)+'%';
  const wrap=document.getElementById('items');
  wrap.innerHTML=ITEMS.map((it,i)=>{
    const cls='it'+(i===curIdx?' active':placed[it.id]?' done':'');
    return `<div class="${cls}" data-i="${i}"><span class="id">${it.id}</span><span class="nm">${it.name}</span>${placed[it.id]?'<span class="ck">✓</span>':''}</div>`;
  }).join('');
  wrap.querySelectorAll('.it').forEach(el=>el.addEventListener('click',()=>{curIdx=+el.dataset.i;render();}));
  const cur=wrap.querySelector('.it.active');
  if(cur)cur.scrollIntoView({block:'nearest'});
  msvg.innerHTML=Object.entries(placed).map(([id,[x,y]])=>{
    const isCur=curIdx>0&&ITEMS[curIdx-1]&&ITEMS[curIdx-1].id===+id;
    const col=isCur?'rgba(88,166,255,.85)':'rgba(255,70,70,.8)';
    return `<circle cx="${x}" cy="${y}" r="5" fill="${col}" stroke="#fff" stroke-width="1"/><text x="${x}" y="${y+1}" fill="#fff" font-size="6" font-weight="700" text-anchor="middle" dominant-baseline="central">${id}</text>`;
  }).join('');
}

function skip(){if(curIdx>=ITEMS.length)return;curIdx++;while(curIdx<ITEMS.length&&placed[ITEMS[curIdx].id])curIdx++;render();}
function undo(){if(!hist.length)return;const h=hist.pop();if(h.prev)placed[h.id]=h.prev;else delete placed[h.id];curIdx=h.idx;render();}
function exp(){
  const out={};for(const[id,[x,y]]of Object.entries(placed))out[+id]=[Math.round(x*2),Math.round(y*2)];
  const txt=JSON.stringify(out);
  navigator.clipboard.writeText(txt).then(()=>{const b=document.getElementById('btn-export');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy JSON  [E]',1500);}).catch(()=>{prompt('Copy this:',txt);});
}

document.getElementById('btn-skip').addEventListener('click',skip);
document.getElementById('btn-undo').addEventListener('click',undo);
document.getElementById('btn-export').addEventListener('click',exp);
window.addEventListener('keydown',e=>{
  if(e.key===' '||e.code==='Space'){e.preventDefault();skip();}
  if(e.key==='z'||e.key==='Z')undo();
  if(e.key==='e'||e.key==='E')exp();
});
render();
</script>
</body>
</html>
